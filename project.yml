name: Stickreate

options:
  bundleIdPrefix: com.cocol
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder.git
    from: 0.14.0
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage.git
    from: 5.18.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  Stickreate:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Stickreate
    dependencies:
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
      - package: SDWebImage
        product: SDWebImage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cocol.stickreate
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Stickreate/Info.plist
      properties:
        CFBundleDisplayName: Stickreate
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take a photo to turn it into a sticker.
        LSApplicationQueriesSchemes:
          - whatsapp
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - StickreateTests
      gatherCoverageData: false

  StickreateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: StickreateTests
    dependencies:
      - target: Stickreate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cocol.stickreate.tests
        GENERATE_INFOPLIST_FILE: YES
